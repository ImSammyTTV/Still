[package]
name = "still"
version = "1.2.7"
description = "Capture, annotate and record your screen"
authors = ["ImSammyTTV"]
edition = "2021"

[lib]
name = "still_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-clipboard-manager = "=2.4.2"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-notification = "=2.6.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.13.3"
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = "=2.5.3"
drag = "=2.1.1"
xcap = "=0.9.8"
rqrr = { version = "=0.11.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.23.1"
sha2 = "=0.10.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The app is built for size, except the code that spends its time on pixels.
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.image]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
x11rb = "=0.13.2"
