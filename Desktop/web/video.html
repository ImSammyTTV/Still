<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trim Video</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-rows: 52px minmax(0, 1fr) auto auto; }
  .titlebar { height: 52px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; min-width: 8px; }
  .clock { font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-2); }

  .stage { position: relative; min-height: 0; background: var(--canvas); display: grid; place-items: center; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .status { position: relative; color: var(--text-2); }

  .transport { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; flex-wrap: wrap; }
  .transport label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
  .transport select { height: 26px; }
  #gifHint { font-size: 11px; color: var(--text-2); max-width: 240px; }

  .trim { padding: 12px 16px 14px; border-top: 1px solid var(--border); background: var(--surface); display: grid; gap: 10px; }
  .trim-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .note { margin: 0; font-size: 11px; color: var(--text-2); }

  /* The trim bar: a film strip with the cut parts dimmed, the kept part framed and a handle at each end. */
  .bar { position: relative; height: 64px; touch-action: none; }
  .strip { position: absolute; left: 0; right: 0; top: 6px; height: 52px; display: flex; gap: 1px; border-radius: 6px; overflow: hidden; background: var(--canvas); }
  .strip canvas { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; top: 6px; height: 52px; background: rgba(0, 0, 0, .6); pointer-events: none; }
  #shadeIn { left: 0; border-radius: 6px 0 0 6px; }
  #shadeOut { right: 0; border-radius: 0 6px 6px 0; }
  .kept { position: absolute; top: 3px; height: 58px; border: 3px solid var(--accent); border-radius: 7px; pointer-events: none; }
  .playhead { position: absolute; top: 0; height: 64px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 3px rgba(0, 0, 0, .7); pointer-events: none; }
  .handle { position: absolute; top: 3px; width: 14px; height: 58px; margin-left: -7px; border-radius: 5px; background: var(--accent); cursor: ew-resize; display: grid; place-items: center; touch-action: none; }
  .handle::after { content: ""; width: 2px; height: 20px; border-radius: 2px; background: var(--accent-text); opacity: .75; }
  .handle:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }

  .error { position: fixed; left: 16px; right: 16px; top: 62px; z-index: 40; display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--bg-elevated); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .error svg.mark { color: var(--red); margin-top: 1px; }
  .error span { flex: 1; user-select: text; overflow-wrap: anywhere; }
  .error .btn { flex: none; }

  /* The page is see-through on Windows glass, so floating cards bring their own blur. */
  .error, .card { backdrop-filter: blur(28px) saturate(1.4); }
  .sheet { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0, 0, 0, .35); }
  .card { width: 340px; display: grid; gap: 12px; padding: 22px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; justify-items: center; }
  .progress { width: 100%; height: 6px; border-radius: 999px; background: var(--surface-strong); overflow: hidden; }
  .progress div { height: 100%; width: 0; border-radius: 999px; background: var(--accent); }
  .card p { margin: 0; font-size: 12px; color: var(--text-2); }
</style>
</head>
<body class="glass">
<div class="titlebar">
  <h1 id="title">Trim Video</h1>
  <span class="grow"></span>
  <button class="btn" id="exportGif" disabled><i data-lucide="film"></i>Export GIF…</button>
  <button class="btn primary" id="exportVideo" disabled><i data-lucide="download"></i>Export Video…</button>
</div>
<div class="stage" id="stage">
  <video id="video" playsinline preload="auto"></video>
  <div class="status" id="status">Loading video…</div>
</div>
<div class="transport">
  <button class="btn icon plain" id="play" title="Play (Space)" disabled><i data-lucide="play"></i></button>
  <span class="clock" id="now">0:00.0</span>
  <button class="btn icon plain" id="mute" title="Mute"><i data-lucide="volume-2"></i></button>
  <span class="grow"></span>
  <label>GIF width
    <select class="field" id="gifWidth"><option value="480">480</option><option value="640">640</option><option value="800" selected>800</option><option value="1280">1280</option></select>
  </label>
  <label>Frame rate
    <select class="field" id="gifFps"><option value="5">5 fps</option><option value="10">10 fps</option><option value="12" selected>12 fps</option><option value="15">15 fps</option><option value="24">24 fps</option></select>
  </label>
  <span id="gifHint" aria-live="polite"></span>
</div>
<section class="trim">
  <div class="trim-head">
    <b>Trim</b>
    <span class="clock dim" id="range"></span>
    <span class="grow"></span>
    <button class="btn" id="setIn" title="Start the video at the playhead (I)" disabled><i data-lucide="arrow-right-to-line"></i>Set In</button>
    <button class="btn" id="setOut" title="End the video at the playhead (O)" disabled><i data-lucide="arrow-left-to-line"></i>Set Out</button>
    <button class="btn plain" id="reset" disabled>Reset</button>
  </div>
  <div class="bar" id="bar">
    <div class="strip" id="strip"></div>
    <div class="shade" id="shadeIn"></div>
    <div class="shade" id="shadeOut"></div>
    <div class="kept" id="kept"></div>
    <div class="playhead" id="playhead"></div>
    <div class="handle" id="handleIn" role="slider" tabindex="0" aria-label="Trim start"></div>
    <div class="handle" id="handleOut" role="slider" tabindex="0" aria-label="Trim end"></div>
  </div>
  <p class="note">Your original is never changed. A trimmed video is re-encoded in real time, so it takes as long as the part you keep. An untrimmed export is an exact copy.</p>
</section>
<div class="error" id="error" role="alert" hidden>
  <i class="mark" data-lucide="circle-alert"></i>
  <span id="errorText"></span>
  <button class="btn" id="errorPlayer" hidden>Open in Default Player</button>
  <button class="btn icon plain" id="errorClose" title="Dismiss"><i data-lucide="x"></i></button>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <b id="sheetTitle">Exporting…</b>
    <div class="progress" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="sheetTitle"><div id="progress"></div></div>
    <span class="clock dim" id="percent">0%</span>
    <p id="sheetNote" hidden></p>
    <button class="btn" id="cancel">Cancel</button>
  </div>
</div>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="shared/trim.js"></script>
<script src="shared/gif.js"></script>
<script src="common.js"></script>
<script src="video.js"></script>
</body>
</html>
