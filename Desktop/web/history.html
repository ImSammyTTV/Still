<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capture History</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-rows: 86px 1fr; }
  .titlebar { height: 86px; padding: 0 var(--space-7); gap: var(--space-5); border-bottom: 1px solid var(--border); }
  h1 { font-size: var(--text-2xl); margin: 0 8px 0 4px; }
  .search { width: 220px; margin-left: auto; }
  /* Rows and cards keep their natural height: in Chromium (Windows' WebView2) a card with overflow: hidden
     could otherwise shrink to nothing when there are many captures. */
  .grid { overflow: auto; padding: 26px var(--space-7); display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: max-content; gap: var(--space-6); align-content: start; min-height: 0; }
  .tile > * { flex: none; }
  .tile { border-radius: var(--radius); background: var(--bg-elevated); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 16px rgba(0,0,0,.08); }
  .tile:hover { border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 16 / 10; background: var(--canvas); display: grid; place-items: center; overflow: hidden; }
  .thumb img, .thumb video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
  .thumb .kind { position: absolute; left: 7px; top: 7px; padding: 2px 7px; border-radius: var(--radius-pill); background: var(--hud); color: var(--on-chrome); font-size: var(--text-xs); display: flex; gap: 4px; align-items: center; }
  .thumb .kind svg { width: 11px; height: 11px; }
  .tools { position: absolute; right: 6px; top: 6px; display: none; gap: 4px; }
  .tile:hover .tools { display: flex; }
  .tools button { width: 26px; height: 26px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--bg-elevated); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .tools svg { width: 13px; height: 13px; }
  .meta { padding: var(--space-4); display: grid; gap: 2px; }
  .title { font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; border-radius: var(--radius-xs); }
  .title[contenteditable="true"] { background: var(--surface); padding: 0 3px; }
  .sub { font-size: var(--text-xs); color: var(--text-2); }
  .empty { grid-column: 1 / -1; display: grid; place-items: center; gap: 10px; padding: 80px 0; color: var(--text-2); text-align: center; }
  .empty svg { width: 40px; height: 40px; opacity: .5; }
  /* Screenshots picked with Ctrl/⌘-click, numbered in the order they'll be joined. */
  .tile.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .pick-number { position: absolute; left: 7px; bottom: 7px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--radius-pill); display: none; place-items: center;
    background: var(--accent); color: var(--accent-text); font-size: var(--text-xs); font-weight: var(--weight-semibold); }
  .tile.picked .pick-number { display: grid; }
  .pickbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; align-items: center; gap: var(--space-2); padding: 6px 6px 6px 16px;
    border-radius: var(--radius-pill); background: var(--hud); color: var(--on-chrome); box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: var(--text-sm); z-index: 20; }
  .pickbar.show { display: flex; }
  .pickbar .btn { height: 30px; }
  .pickbar .btn svg { width: 14px; height: 14px; }

  .star { position: absolute; right: 7px; bottom: 7px; width: 26px; height: 26px; border: 0; border-radius: 50%; display: none; place-items: center; background: var(--hud); color: var(--on-chrome); }
  .star svg { width: 14px; height: 14px; }
  .tile:hover .star, .star.on { display: grid; }
  .star.on { color: var(--yellow); }
  .star.on svg { fill: currentColor; }
  #filter button svg { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; }
  .tile.missing .thumb img, .tile.missing .thumb video { visibility: hidden; }
  .tile.missing .thumb::after { content: "File moved or deleted"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-2); font-size: var(--text-sm); }
</style>
</head>
<body class="glass">
<div class="titlebar">
  <h1>Capture History</h1>
  <div class="segmented" id="filter">
    <button data-kind="all" class="active">All</button>
    <button data-kind="screenshot">Screenshots</button>
    <button data-kind="recording">Recordings</button>
    <button data-kind="starred" title="Captures you starred"><i data-lucide="star"></i>Starred</button>
  </div>
  <input class="field search" id="search" aria-label="Search captures" placeholder="Search titles and text">
</div>
<div class="grid" id="grid"></div>
<div class="pickbar" id="pickbar" role="toolbar" aria-label="Combine screenshots">
  <span id="pickCount"></span>
  <button class="btn" id="combineSide" title="Join them left to right"><i data-lucide="columns-2"></i>Side by Side</button>
  <button class="btn" id="combineStack" title="Join them top to bottom"><i data-lucide="rows-2"></i>Top to Bottom</button>
  <button class="btn icon plain" id="pickClear" title="Clear the selection (Esc)"><i data-lucide="x"></i></button>
</div>
<script src="bridge.js"></script>
<script src="vendor/icons.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="history.js"></script>
</body>
</html>
