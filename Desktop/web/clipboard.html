<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clipboard History</title>
<link rel="stylesheet" href="style.css">
<style>
  /* A small list that opens by the pointer, like a menu: search on top, the newest copies first, keys at the bottom. */
  body { display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); border: 1px solid var(--border); }
  .top { display: flex; align-items: center; gap: var(--space-2); padding: 10px 10px 8px; }
  .top .field { flex: 1; min-width: 0; }
  .top .btn svg { width: 15px; height: 15px; }
  .list { overflow-y: auto; padding: 0 6px 6px; min-height: 0; outline: none; }
  .entry { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; min-height: 44px; padding: 5px 8px; border-radius: var(--radius-sm); cursor: default; }
  .entry.active { background: var(--selection); color: #fff; }
  .entry.active .detail, .entry.active kbd { color: rgba(255, 255, 255, 0.82); }
  .entry.active kbd { background: rgba(255, 255, 255, 0.2); }
  .glyph { width: 32px; height: 32px; border-radius: var(--radius-xs); display: grid; place-items: center; background: var(--surface); color: var(--text-2); overflow: hidden; }
  .entry.active .glyph { background: rgba(255, 255, 255, 0.2); color: #fff; }
  .glyph svg { width: 16px; height: 16px; }
  .glyph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .words { min-width: 0; display: grid; gap: 1px; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { font-size: var(--text-xs); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font: var(--text-xs) var(--font); min-width: 18px; text-align: center; padding: 1px 5px; border-radius: var(--radius-xs); background: var(--surface-strong); color: var(--text-2); }
  .empty { display: grid; place-items: center; align-content: center; gap: var(--space-2); height: 100%; padding: var(--space-5); text-align: center; color: var(--text-2); }
  .empty svg { width: 32px; height: 32px; opacity: .5; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 7px 12px 9px; border-top: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-2); }
</style>
</head>
<body class="glass">
<div class="top">
  <input class="field" id="search" type="search" placeholder="Search clipboard history" aria-label="Search clipboard history" autocomplete="off" spellcheck="false">
  <button class="btn icon plain" id="settings" title="Clipboard settings"><i data-lucide="settings"></i></button>
</div>
<div class="list" id="list" role="listbox" aria-label="Clipboard history"></div>
<div class="keys" id="keys"></div>
<script src="bridge.js"></script>
<script src="vendor/icons.js"></script>
<script src="shared/geometry.js"></script>
<script src="shared/clipboard-history.js"></script>
<script src="common.js"></script>
<script src="clipboard.js"></script>
</body>
</html>
