<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pinned Screenshot</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: #000; }
  img { width: 100vw; height: 100vh; object-fit: fill; display: block; cursor: grab; -webkit-user-drag: none; }
  .bar { position: fixed; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  body:hover .bar { opacity: 1; }
  .bar button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; }
  .bar svg { width: 13px; height: 13px; }
  .level { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; opacity: 0; transition: opacity .2s; }
  .level.show { opacity: 1; }
</style>
</head>
<body>
<img id="img" alt="">
<div class="bar">
  <button id="lock" title="Lock (click-through)"><i data-lucide="lock"></i></button>
  <button id="close" title="Close"><i data-lucide="x"></i></button>
</div>
<div class="level" id="level"></div>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="pin.js"></script>
</body>
</html>
