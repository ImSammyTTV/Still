<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Open on Phone</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .card { position: absolute; inset: 6px; border-radius: var(--radius-xl); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: var(--bg-elevated); color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.38), 0 0 0 1px var(--border); }
  header { align-self: stretch; display: flex; align-items: center; gap: 8px; }
  header b { flex: 1; font-size: 14px; }
  /* The code stays black on white in either theme: phone cameras read it best that way. */
  .code { width: 236px; height: 236px; padding: 10px; border-radius: var(--radius-md); background: #fff; display: grid; place-items: center; }
  .code svg { width: 100%; height: 100%; display: block; }
  .hint { margin: 0; font-size: var(--text-sm); color: var(--text-2); text-align: center; }
  #link { max-width: 100%; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
  .actions { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="card" role="dialog" aria-labelledby="heading">
  <header class="titlebar"><b id="heading">Open on Phone</b><button class="btn icon plain" id="close" title="Close (Esc)"><i data-lucide="x"></i></button></header>
  <div class="code" id="code" role="img" aria-label="QR code for the share link"></div>
  <p class="hint">Point your phone’s camera at the code to open the link.</p>
  <span id="link"></span>
  <div class="actions"><button class="btn" id="copy"><i data-lucide="copy"></i>Copy Link</button></div>
</div>
<script src="bridge.js"></script>
<script src="vendor/icons.js"></script>
<script src="common.js"></script>
<script src="qr.js"></script>
</body>
</html>
