<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Still update</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .card { position: absolute; inset: 6px; border-radius: var(--radius-xl); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px;
    background: var(--bg-elevated); color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.38), 0 0 0 1px var(--border); animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .head img { width: 42px; height: 42px; flex: none; border-radius: var(--radius-md); }
  .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #title { font-size: 14px; font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: var(--text-sm); color: var(--text-2); line-height: 1.35; }
  #sub.error { color: var(--red); }
  .progress { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; display: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .card.busy .progress { display: block; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions .btn { min-width: 76px; }
</style>
</head>
<body>
<div class="card" role="dialog" aria-labelledby="title">
  <div class="head">
    <img src="icon.png" alt="">
    <div class="text">
      <span class="label">Update available</span>
      <span id="title"></span>
      <span id="sub"></span>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="actions">
    <button class="btn" id="later">Later</button>
    <button class="btn primary" id="install">Install and Restart</button>
  </div>
</div>
<script src="bridge.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="update-page.js"></script>
</body>
</html>
