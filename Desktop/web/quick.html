<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Floating Preview</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; }
  /* Still's floating preview: the capture on top, a permanent action bar underneath. */
  .card { position: absolute; inset: 6px; border-radius: var(--radius-xl); overflow: hidden; display: grid; grid-template-rows: 30px 1fr 36px; background: var(--chrome); color: var(--on-chrome);
    box-shadow: var(--shadow-float); animation: slide .28s cubic-bezier(.2,.9,.3,1.1); cursor: grab; }
  .card header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
  .card header .label { color: var(--on-chrome-2); }
  .card header b { font-size: var(--text-sm); font-weight: var(--weight-semibold); }
  body.right .card { animation-name: slide-right; }
  @keyframes slide { from { transform: translateX(-120%); } }
  @keyframes slide-right { from { transform: translateX(120%); } }
  .card.leaving { transition: transform .22s ease-in, opacity .22s; transform: translateX(-120%); opacity: 0; }
  body.right .card.leaving { transform: translateX(120%); }
  #media { position: relative; overflow: hidden; background: var(--chrome-deep); border-bottom: 2px solid var(--accent); }
  .media { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
  .badge { position: absolute; right: 8px; bottom: 8px; padding: 2px 7px; border-radius: var(--radius-pill); font-size: var(--text-xs); background: var(--hud); color: var(--on-chrome); }
  .actions { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; cursor: default; }
  .actions button { width: 30px; height: 26px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--on-chrome); display: grid; place-items: center; }
  .actions button:hover { background: var(--chrome-surface); }
  .actions button.primary { width: auto; padding: 0 10px; background: var(--accent); color: var(--accent-text); font-size: var(--text-sm); font-weight: var(--weight-semibold); gap: 5px; display: inline-flex; align-items: center; }
  .actions svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="card" id="card">
  <header><span class="label">Capture ready</span><b>Still.</b></header>
  <div id="media"></div>
  <div class="actions">
    <button class="primary" id="copy" title="Copy"><i data-lucide="copy"></i>Copy</button>
    <button id="save" title="Save"><i data-lucide="download"></i></button>
    <button id="edit" title="Annotate"><i data-lucide="pencil"></i></button>
    <button id="pin" title="Pin to Screen"><i data-lucide="pin"></i></button>
    <button id="upload" title="Upload and Copy Link"><i data-lucide="cloud-upload"></i></button>
    <button id="trash" title="Delete"><i data-lucide="trash-2"></i></button>
    <button id="close" title="Close"><i data-lucide="x"></i></button>
  </div>
</div>
<script src="bridge.js"></script>
<script src="vendor/icons.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="quick.js"></script>
</body>
</html>
