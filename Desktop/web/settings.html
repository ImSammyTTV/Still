<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Still Settings</title>
<link rel="stylesheet" href="style.css">
<style>
  /* macOS System Settings layout: a sidebar of coloured icon tiles and rounded grouped lists. */
  body { display: grid; grid-template-columns: 210px 1fr; }
  nav { background: var(--sidebar); border-right: 1px solid var(--border); padding: var(--space-3) 10px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; -webkit-app-region: drag; }
  nav button { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 9px; min-height: 32px; flex-shrink: 0; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; text-align: left; }
  nav button:hover { background: var(--surface); }
  nav button.active { background: var(--accent); color: var(--accent-text); }
  nav button.active .tile { box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .settings-search { width: 100%; margin-bottom: 10px; flex-shrink: 0; -webkit-app-region: no-drag; }
  .nav-empty { color: var(--text-2); font-size: var(--text-sm); padding: var(--space-3) var(--space-2); }
  /* Category tiles use the system's category colours (see docs/DESIGN-SYSTEM.md), always with a white glyph. */
  .tile { width: 22px; height: 22px; border-radius: var(--radius-sm); display: grid; place-items: center; color: #fff; }
  .tile svg { width: 13px; height: 13px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: var(--space-1) var(--space-2) 14px; }
  .brand img { width: 34px; height: 34px; border-radius: var(--radius-md); }
  .brand b { display: block; font-size: var(--text-md); }
  .brand span { font-size: var(--text-xs); color: var(--text-2); }
  .spacer { flex: 1; }
  section { overflow: auto; display: grid; grid-template-rows: 64px 1fr; min-height: 0; }
  section header { height: 64px; display: flex; align-items: center; padding: 0 var(--space-5); font-size: var(--text-2xl); font-weight: var(--weight-heading); letter-spacing: -.01em; -webkit-app-region: drag; }
  header.titlebar { height: 64px; padding: 0 var(--space-3) 0 var(--space-6); }
  .content { overflow: auto; padding: 0 var(--space-6) var(--space-7); }
  .group-title { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-2); margin: var(--space-4) var(--space-1) 6px; }
  .group { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); }
  .row { display: flex; align-items: center; gap: var(--space-3); min-height: 40px; padding: 6px var(--space-3); border-top: 1px solid var(--border); }
  .row:first-child { border-top: 0; }
  .row > span:first-child { flex: 1; }
  .hint { font-size: var(--text-xs); color: var(--text-2); margin: 6px var(--space-1) 0; }
  .keys { min-width: 170px; height: 28px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); padding: 0 10px; }
  .keys.recording { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .keys.failed { border-color: var(--red); }
  .keys kbd { font: var(--text-xs) var(--font); padding: 1px 6px; border-radius: var(--radius-xs); background: var(--surface-strong); }
  .keys .placeholder { color: var(--text-2); font-size: var(--text-sm); }
  .about { display: grid; place-items: center; gap: var(--space-2); padding: 40px 0; text-align: center; }
  .about img { width: 96px; height: 96px; }
  .warning { color: var(--red); font-size: var(--text-xs); }
</style>
</head>
<body class="glass">
<nav id="nav" aria-label="Settings categories">
  <div class="brand-row"><div class="brand"><img src="icon.png" alt=""><div><b>Still</b><span>Capture studio</span></div></div></div>
</nav>
<section aria-labelledby="pageTitle">
  <header><span id="pageTitle"></span></header>
  <div class="content" id="content"></div>
</section>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
