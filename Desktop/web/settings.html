<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Still Settings</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-columns: 210px 1fr; }
  nav { background: var(--sidebar); border-right: 1px solid var(--border); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; -webkit-app-region: drag; }
  nav button { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
  nav button:hover { background: var(--surface); }
  nav button.active { background: var(--surface-strong); }
  .tile { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
  .tile svg { width: 13px; height: 13px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 34px 8px 16px; }
  .brand img { width: 34px; height: 34px; }
  .brand b { display: block; font-size: 13px; }
  .brand span { font-size: 11px; color: var(--text-2); }
  .spacer { flex: 1; }
  section { overflow: auto; display: grid; grid-template-rows: 44px 1fr; min-height: 0; }
  header { display: flex; align-items: center; padding: 0 20px; font-weight: 600; -webkit-app-region: drag; }
  .content { overflow: auto; padding: 0 20px 24px; }
  .group-title { font-size: 11px; font-weight: 600; color: var(--text-2); margin: 16px 4px 6px; }
  .group { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 6px 12px; border-top: 1px solid var(--border); }
  .row:first-child { border-top: 0; }
  .row > span:first-child { flex: 1; }
  .hint { font-size: 11px; color: var(--text-2); margin: 6px 4px 0; }
  .keys { min-width: 170px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px; }
  .keys.recording { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .keys.failed { border-color: var(--red); }
  .keys kbd { font: 11px var(--font); padding: 1px 6px; border-radius: 4px; background: var(--surface-strong); }
  .keys .placeholder { color: var(--text-3); font-size: 12px; }
  .about { display: grid; place-items: center; gap: 8px; padding: 40px 0; text-align: center; }
  .about img { width: 96px; height: 96px; }
  .warning { color: var(--red); font-size: 11px; }

  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { flex-direction: row; flex-wrap: wrap; gap: 4px 12px; padding: 14px 24px; border-right: 0; border-bottom: 1px solid var(--border); }
  nav .brand { flex-basis: 100%; padding: 8px 0 15px; }
  .brand b { font-size: 30px; }
  nav .tile { display: none; }
  nav button { border-radius: 0; border-bottom: 2px solid transparent; padding: 0 2px; }
  nav button.active { background: transparent; border-color: var(--accent); color: var(--accent); }
  nav .spacer { display: none; }
  section header { height: 68px; font: 30px "Baskerville", Georgia, serif; }
  section { grid-template-rows: 68px 1fr; }
  .content { padding: 0 28px 28px; }
  .group { border-radius: 3px; }
</style>
</head>
<body>
<nav id="nav">
  <div class="brand"><img src="icon.png" alt=""><div><b>Still</b><span>Capture studio</span></div></div>
</nav>
<section>
  <header><span id="pageTitle"></span></header>
  <div class="content" id="content"></div>
</section>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
