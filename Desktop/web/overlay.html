<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capture Selection</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: #000; cursor: crosshair; }
  body.window-mode { cursor: none; }
  body.moving-selection { cursor: grabbing; }
  /* Under an area being adjusted: takes it, like Enter or a double-click inside. */
  .sel-capture { position: fixed; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border: 1px solid var(--chrome-border);
    border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-text); font-size: var(--text-sm); font-weight: var(--weight-semibold); box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: default; }
  .sel-capture[hidden] { display: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Still's capture bar: a slim pill along the top of the screen. */
  .bar { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: none; align-items: center; gap: 4px; height: 44px; padding: 0 6px;
    border-radius: var(--radius-pill); background: var(--hud); color: var(--on-chrome); border: 1px solid var(--chrome-border); box-shadow: 0 10px 34px rgba(0,0,0,.45); cursor: default; }
  body.primary .bar { display: flex; }
  /* The Still mark, in the accent colour, doubles as the bar's handle. */
  .brand { display: grid; place-items: center; padding: 0 6px 0 8px; height: 100%; cursor: grab; touch-action: none; }
  .brand .mark { width: 17px; height: 17px; background: var(--accent); -webkit-mask: url(mark.png) center / contain no-repeat; mask: url(mark.png) center / contain no-repeat; }
  body.moving-bar, body.moving-bar .brand { cursor: grabbing; }
  .mode { height: 32px; padding: 0 11px; border: 0; border-radius: var(--radius-pill); background: transparent; display: inline-flex; align-items: center; gap: 6px; color: var(--on-chrome); font-size: var(--text-sm); font-weight: var(--weight-medium); }
  .mode:hover { background: var(--chrome-surface); }
  .mode.active { background: var(--accent); color: var(--accent-text); }
  .mode svg { width: 15px; height: 15px; }
  .divider { width: 1px; height: 20px; background: var(--chrome-border); margin: 0 4px; }
  .dims { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: var(--radius-pill); background: var(--chrome-surface); }
  .dim { width: 40px; border: 0; background: transparent; text-align: center; outline: none; color: var(--on-chrome); font: var(--text-sm) var(--mono); }
  .dim::placeholder { color: var(--on-chrome-2); }
  .times { color: var(--on-chrome-2); }
  #aspect { padding: 0 9px; }
  .camera { position: fixed; pointer-events: none; display: none; color: var(--on-chrome); filter: drop-shadow(0 1px 2px rgba(0,0,0,.9)); transform: translate(-50%, -50%); }
  body.window-mode .camera { display: block; }
  .menu { color: var(--on-chrome); background: var(--hud); border-color: var(--chrome-border); }

</style>
</head>
<body>
<canvas id="canvas"></canvas>
<button class="sel-capture" id="selCapture" hidden><i data-lucide="camera" style="width:15px;height:15px"></i>Capture</button>
<div class="camera" id="camera"><i data-lucide="camera" style="width:24px;height:24px"></i></div>
<div class="bar" id="bar">
  <span class="brand" id="barHandle" title="Drag to move the Capture Bar" aria-label="Move the Capture Bar" role="button"><span class="mark"></span></span>
  <!-- The same order and glyphs as the Mac bar (rectangle.dashed, macwindow, display, arrow.down.to.line | text.viewfinder,
       record.circle, timer), drawn here so both bars look alike. -->
  <button class="mode active" data-mode="area" title="Area (A)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke-dasharray="3.2 2.4"/></svg>Area</button>
  <button class="mode" data-mode="window" title="Window (hold Space)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 8.5h19"/><circle cx="5.4" cy="6.25" r=".9" fill="currentColor" stroke="none"/><circle cx="7.9" cy="6.25" r=".9" fill="currentColor" stroke="none"/><circle cx="10.4" cy="6.25" r=".9" fill="currentColor" stroke="none"/></svg>Window</button>
  <button class="mode" data-mode="fullscreen" title="Screen (F)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M12 16.5v3.5M8 20.5h8"/></svg>Screen</button>
  <button class="mode" data-mode="scroll" title="Scrolling capture (S)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v12.5M7 11l5 5 5-5M4.5 20.5h15"/></svg>Scroll</button>
  <div class="divider"></div>
  <button class="mode" data-mode="text" title="Copy text (O)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16M7.5 9h9M7.5 12h9M7.5 15h5.5"/></svg>Text</button>
  <button class="mode" data-mode="record" title="Record (V)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.3" fill="currentColor" stroke="none"/></svg>Record</button>
  <button class="mode" data-mode="timer" title="Timer (T)"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-6.4 2.65"/><path d="M12 12 7.6 7.6"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>Timer</button>
  <div class="divider"></div>
  <span class="dims"><input class="dim" id="width" placeholder="W" aria-label="Capture width"><span class="times">×</span><input class="dim" id="height" placeholder="H" aria-label="Capture height"></span>
  <button class="mode" id="aspect" title="Lock aspect ratio"><!-- Nested frames, the same glyph as the Mac bar's "aspectratio" symbol. --><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2.5"/><rect x="5.5" y="7.5" width="10" height="7" rx="1.5"/></svg></button>
</div>
<script src="bridge.js"></script>
<script src="vendor/icons.js"></script>
<script src="shared/geometry.js"></script>
<script src="shared/capture-input.js"></script>
<script src="common.js"></script>
<script src="overlay.js"></script>
</body>
</html>
