<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Still — Annotate</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-rows: 44px 1fr 45px; }
  .titlebar { border-bottom: 1px solid var(--border); background: var(--bg); }
  .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  main { position: relative; display: grid; grid-template-columns: auto 1fr auto; min-height: 0; background: var(--canvas); }
  /* Still's tool rail: drawing tools stacked down the left edge. */
  .rail { width: 50px; padding: 10px 7px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; overflow-x: hidden; background: var(--bg); border-right: 1px solid var(--border); }
  .rail button { width: 36px; height: 32px; border: 0; border-radius: 9px; background: transparent; color: var(--text); display: grid; place-items: center; flex: none; }
  .rail button:hover { background: var(--surface-strong); }
  .rail button.active { background: var(--accent); color: #fff; }
  .rail svg { width: 16px; height: 16px; }
  .scroller { overflow: auto; display: grid; place-items: center; min-height: 0; padding: 28px; }
  #stage { display: block; box-shadow: 0 2px 20px rgba(0,0,0,.25); image-rendering: auto; }
  #stage.tool-select { cursor: default; }
  #stage.tool-text { cursor: text; }
  #stage:not(.tool-select):not(.tool-text) { cursor: crosshair; }
  #stage.moving { cursor: move; }
  .panel { width: 0; overflow: hidden; background: var(--bg); border-left: 1px solid var(--border); transition: width .18s; }
  .panel.open { width: 290px; }
  .panel-inner { width: 290px; padding: 16px; display: grid; gap: 14px; }
  .panel h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .gradients { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .gradients button { height: 28px; border-radius: 6px; border: 1px solid var(--border); padding: 0; }
  .gradients button.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .value { width: 34px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  footer { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 13px; border-top: 1px solid var(--border); background: var(--bg); }
  .drag { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 0 14px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px; background: var(--surface-strong); cursor: grab; }
  .spacer { flex: 1; }
  .crop-bar { position: absolute; left: calc(50% + 25px); top: 14px; transform: translateX(-50%); display: none; gap: 8px; padding: 6px; border-radius: 999px; background: var(--hud); color: #fff; z-index: 5; }
  .crop-bar.show { display: flex; }
  .crop-bar .btn { background: rgba(255,255,255,.14); color: #fff; }
  .crop-bar .btn.primary { background: var(--accent); }
  textarea.text-edit { position: absolute; z-index: 6; border: 1px dashed var(--accent); background: transparent; outline: none; resize: none; overflow: hidden; padding: 0; margin: 0; white-space: pre; font-weight: 600; line-height: 1.2; }
  .palette { display: grid; grid-template-columns: repeat(5, 22px); gap: 8px; padding: 6px; }
  .palette button { width: 22px; height: 22px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  .palette button.active { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 4px var(--accent); }
  .drop-hint { position: absolute; inset: 12px; z-index: 7; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: var(--radius); pointer-events: none; }
  .drop-hint span { padding: 8px 14px; border-radius: 999px; background: var(--hud); color: #fff; font-size: 12px; }
  .sheet-backdrop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0,0,0,.28); }
  .sheet { width: 340px; padding: 18px; display: grid; gap: 14px; border-radius: var(--radius); background: var(--bg-elevated); backdrop-filter: blur(24px); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .sheet h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .sheet-size { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .sheet-size input { flex: 1; min-width: 0; color: var(--text); }
  .sheet-error { margin: 0; min-height: 18px; font-size: 12px; color: var(--red); }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; }

  main { grid-template-columns: 1fr auto auto; }
  .scroller { grid-column: 1; grid-row: 1; background-image: radial-gradient(var(--border) .7px, transparent .7px); background-size: 18px 18px; }
  .rail { grid-column: 2; grid-row: 1; width: 72px; padding: 20px 12px; border-left: 1px solid var(--border); border-right: 0; gap: 8px; }
  .rail button { width: 46px; height: 38px; border-radius: 9px; }
  .rail button.active { background: var(--accent); color: white; }
  .panel { grid-column: 3; grid-row: 1; }
  .drag { position: static; transform: none; margin-left: auto; border-radius: 999px; }
</style>
</head>
<body class="glass">
<div class="titlebar">
  <div class="spacer"></div>
  <button class="btn plain icon no-drag" id="color" title="Color"><span class="swatch" id="swatch"></span></button>
  <button class="btn plain icon no-drag" id="stroke" title="Stroke width"><i data-lucide="minus"></i></button>
  <button class="btn plain icon no-drag" id="style" title="Style" aria-haspopup="menu"><i data-lucide="move-up-right"></i></button>
  <div class="segmented no-drag">
    <button id="undo" title="Undo (Ctrl+Z)"><i data-lucide="undo-2"></i></button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)"><i data-lucide="redo-2"></i></button>
  </div>
  <button class="btn plain icon no-drag" id="transform" title="Resize, rotate and flip" aria-haspopup="menu"><i data-lucide="scaling"></i></button>
  <button class="btn plain icon no-drag" id="background" title="Background"><i data-lucide="image"></i></button>
</div>
<main>
  <aside class="rail" id="tools" aria-label="Tools"></aside>
  <div class="crop-bar" id="cropBar">
    <button class="btn" id="cropReset">Reset</button>
    <button class="btn" id="cropCancel">Cancel</button>
    <button class="btn primary" id="cropApply">Crop</button>
  </div>
  <div class="scroller" id="scroller"><canvas id="stage"></canvas></div>
  <div class="drop-hint" id="dropHint" hidden><span>Drop to add to the image</span></div>
  <aside class="panel" id="panel">
    <div class="panel-inner">
      <h3>Background</h3>
      <div class="gradients" id="gradients"></div>
      <button class="btn" id="customBg"><i data-lucide="image-plus"></i>Custom Image…</button>
      <div class="row"><span>Padding</span><input type="range" id="padding" min="0" max="240"><span class="value" id="paddingValue"></span></div>
      <div class="row"><span>Corner radius</span><input type="range" id="radius" min="0" max="80"><span class="value" id="radiusValue"></span></div>
      <div class="row"><span>Shadow</span><input type="checkbox" class="switch" id="shadow"></div>
      <div class="row"><span>Aspect ratio</span>
        <select class="field" id="aspect"><option value="0">Auto</option><option value="1">1:1</option><option value="1.3333">4:3</option><option value="1.7778">16:9</option><option value="0.5625">9:16</option><option value="1.91">Twitter 1.91:1</option></select>
      </div>
      <div class="row"><span>Auto balance</span><input type="checkbox" class="switch" id="balance"></div>
    </div>
  </aside>
</main>
<footer>
  <button class="btn plain" id="zoom">Fit</button>
  <span id="size" style="color:var(--text-2)"></span>
  <div class="spacer"></div>
  <div class="drag" id="dragMe" title="Drag the image into another app">Drag to share</div>
  <button class="btn icon" id="ocr" title="Copy text (OCR)"><i data-lucide="scan-text"></i></button>
  <button class="btn icon" id="pin" title="Pin to screen"><i data-lucide="pin"></i></button>
  <button class="btn icon" id="upload" title="Upload and copy link"><i data-lucide="cloud-upload"></i></button>
  <button class="btn icon" id="saveAs" title="Save As…"><i data-lucide="folder-down"></i></button>
  <button class="btn" id="copy"><i data-lucide="copy"></i>Copy</button>
  <button class="btn primary" id="save"><i data-lucide="download"></i>Save</button>
</footer>
<div class="sheet-backdrop" id="resizeSheet" hidden>
  <form class="sheet" id="resizeForm" role="dialog" aria-modal="true" aria-labelledby="resizeTitle" novalidate>
    <h3 id="resizeTitle">Resize Image</h3>
    <div class="sheet-size">
      <input class="field" id="resizeW" type="number" min="1" max="30000" step="1" aria-label="Width">
      <span>×</span>
      <input class="field" id="resizeH" type="number" min="1" max="30000" step="1" aria-label="Height">
      <span>pixels</span>
    </div>
    <div class="row"><span>Keep aspect ratio</span><input type="checkbox" class="switch" id="resizeLock" checked></div>
    <p class="sheet-error" id="resizeError" role="alert"></p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="resizeCancel">Cancel</button>
      <button type="submit" class="btn primary" id="resizeApply">Resize</button>
    </div>
  </form>
</div>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="shared/marks.js"></script>
<script src="common.js"></script>
<script src="vendor/ocr/tesseract.min.js"></script>
<script src="ocr.js"></script>
<script src="editor.js"></script>
</body>
</html>
