<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Recording</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; }
  .hud { position: absolute; inset: 4px; border-radius: 999px; background: rgba(30,30,32,.92); color: #fff; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px;
    box-shadow: 0 6px 22px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.1); -webkit-app-region: drag; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff453a; animation: pulse 1.4s infinite; }
  .paused .dot { animation: none; background: #ffd60a; }
  @keyframes pulse { 50% { opacity: .35; } }
  .time { font: 600 13px var(--mono); min-width: 52px; }
  .spacer { flex: 1; }
  button { -webkit-app-region: no-drag; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; }
  button:hover { background: rgba(255,255,255,.2); }
  button.stop { background: #ff453a; }
  button svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="hud" id="hud">
  <span class="dot"></span><span class="time" id="time">Ready</span><span class="spacer"></span>
  <button id="cancel" title="Cancel"><i data-lucide="trash-2"></i></button>
  <button id="restart" title="Restart"><i data-lucide="rotate-ccw"></i></button>
  <button id="pause" title="Pause"><i data-lucide="pause"></i></button>
  <button id="stop" class="stop" title="Stop and save"><i data-lucide="square"></i></button>
</div>
<script src="bridge.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="shared/geometry.js"></script>
<script src="shared/capture-input.js"></script>
<script src="common.js"></script>
<script src="hud.js"></script>
</body>
</html>
