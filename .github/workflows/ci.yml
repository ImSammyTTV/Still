name: Verify Still
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Build and test native components
        run: swift test
      - name: Build universal application
        env:
          STILL_SIGN_IDENTITY: '-'
        run: ./scripts/build.sh "$RUNNER_TEMP/Still.app"
      - name: Check both architectures
        run: lipo -archs "$RUNNER_TEMP/Still.app/Contents/MacOS/Still" | grep -q "x86_64 arm64\|arm64 x86_64"
  sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test sharing service
        run: python3 -m unittest discover -s Cloud/tests -v
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Linux dependencies
        # A package mirror sometimes hangs. Each attempt gets 6 minutes and apt gives up on a stalled download after
        # 30 seconds, so a stuck mirror is tried again instead of holding the whole check up.
        timeout-minutes: 20
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 360 apt-get $apt update && sudo timeout 360 apt-get $apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libdbus-1-dev libgbm-dev libegl-dev libwayland-dev; then exit 0; fi
            echo "Package download stalled or failed (attempt $attempt); trying again."; sleep 10
          done
          exit 1
      - run: npm ci
      - run: npm test
