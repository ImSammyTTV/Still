name: Desktop self-test
on:
  workflow_dispatch:
  push:
    paths: ['Desktop/**']
permissions:
  contents: read
env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libdbus-1-dev libgbm-dev libegl-dev libwayland-dev xvfb openbox dbus-x11
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm test
      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: '3.13' }
      - name: Start a local Still Cloud server
        run: |
          STILL_ADMIN_TOKEN=selftest-token-0123456789abcdef nohup python ../Cloud/server.py --data "$RUNNER_TEMP/cloud" --port 7843 > "$RUNNER_TEMP/cloud.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7843/ >/dev/null && break; sleep 1; done
          echo "STILL_TEST_CLOUD=http://127.0.0.1:7843" >> "$GITHUB_ENV"
          echo "STILL_TEST_CLOUD_TOKEN=selftest-token-0123456789abcdef" >> "$GITHUB_ENV"
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath src-tauri/target/debug/still.exe -ArgumentList '--self-test=selftest-out' -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error 'Self-test timed out' }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Get-Content selftest-out/results.json
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1440x900x24 & sleep 2
          export DISPLAY=:99 XDG_SESSION_TYPE=x11
          openbox & sleep 1
          dbus-run-session -- timeout 180 src-tauri/target/debug/still --self-test=selftest-out || true
          cat selftest-out/results.json
      - name: Check the results
        run: |
          node -e "const r=require('./selftest-out/results.json');const bad=['previewCreated','afterCaptureCopy'].filter(k=>r[k]!==true);if(bad.length){console.error('Self-test failed - '+bad.join(', '));process.exit(1)}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: selftest-${{ matrix.os }}
          path: Desktop/selftest-out
