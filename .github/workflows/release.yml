name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.0.0
        required: true
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - name: Build universal app
        env:
          STILL_SIGN_IDENTITY: '-'
        run: ./scripts/build.sh "$RUNNER_TEMP/Still.app"
      - name: Zip
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Still.app" "Still-${{ inputs.version }}-mac-universal.zip"
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: "Still-*-mac-universal.zip" }
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: Desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: "Desktop/dist/Still-*-win-*.*" }
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            Desktop/dist/*.AppImage
            Desktop/dist/*.deb
            Desktop/dist/*.rpm
            Desktop/dist/*.tar.gz
  publish:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release, merge-multiple: true }
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" release/* --repo "${{ github.repository }}" --title "Still ${{ inputs.version }}" --generate-notes
