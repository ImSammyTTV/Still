name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.1.0
        required: true
permissions:
  contents: write
env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libdbus-1-dev libgbm-dev libegl-dev libwayland-dev patchelf rpm
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
      - run: swift test
      - name: Import the signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # A self-signed certificate keeps the same identity across releases, so macOS
          # remembers Screen Recording permission after updates. It isn't Apple-notarized.
          KC="$RUNNER_TEMP/still.keychain-db"; KP=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/still.p12"
          security create-keychain -p "$KP" "$KC" && security set-keychain-settings -lut 3600 "$KC" && security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/still.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/still.p12"
          echo "STILL_SIGN_IDENTITY=$(security find-identity -p codesigning "$KC" | awk '/Still Self-Signed/ {print $2; exit}')" >> "$GITHUB_ENV"
      - name: Build universal app
        run: ./scripts/build.sh "$RUNNER_TEMP/Still.app"
      - name: Zip
        run: V="${{ inputs.version }}"; ditto -c -k --keepParent "$RUNNER_TEMP/Still.app" "Still-${V#v}-mac-universal.zip"
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: "Still-*-mac-universal.zip" }
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: windows-arm64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Set version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          sed -i.bak "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --target ${{ matrix.target }} ${{ runner.os == 'Windows' && '--bundles nsis' || '--bundles appimage,deb,rpm' }}
      - name: Collect
        run: |
          mkdir -p ../out
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          find $B -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) -exec cp {} ../out/ \;
          if [ "${{ runner.os }}" = "Windows" ]; then V="${{ inputs.version }}"; cp src-tauri/target/${{ matrix.target }}/release/still.exe "../out/Still-${V#v}-${{ matrix.name }}-portable.exe"; fi
          ls -la ../out
      # Windows code signing through SignPath Foundation (free for open source). It stays off until
      # the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      - name: Upload unsigned Windows files for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with: { name: "unsigned-${{ matrix.name }}", path: "out/*.exe" }
      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Still' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed files and refresh update signatures
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        working-directory: Desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cp ../signed/*.exe ../out/
          for f in ../out/*-setup.exe; do rm -f "$f.sig"; npx tauri signer sign "$f"; done
      - uses: actions/upload-artifact@v7
        with: { name: "${{ matrix.name }}", path: out }
  publish:
    needs: [mac, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: release, merge-multiple: true }
      - name: Update feed and checksums
        run: |
          node Desktop/scripts/latest-json.mjs release "${{ inputs.version }}" "${{ github.repository }}"
          cd release && sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.version }}" release/* --repo "${{ github.repository }}" --title "Still ${{ inputs.version }}" --generate-notes
