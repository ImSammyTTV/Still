<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a3442"/><stop offset="1" stop-color="#062430"/></linearGradient>
<style>
/* A 6-second loop: each step brightens in turn and the arrow after it pulses. */
.step { animation:step 6s ease-in-out infinite; opacity:.55 } .s1 { animation-delay:2s } .s2 { animation-delay:4s }
@keyframes step { 0%,40%,100% { opacity:.55 } 10%,30% { opacity:1 } }
.arrow { animation:pulse 6s ease-in-out infinite; opacity:.4 } .a0 { animation-delay:1s } .a1 { animation-delay:3s }
@keyframes pulse { 0%,40%,100% { opacity:.4 } 15%,25% { opacity:1 } }
@media (prefers-reduced-motion: reduce) { .step,.arrow { animation:none; opacity:1 } }
</style></defs>
<rect width="1280" height="210" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g class="step s0"><rect x="60" y="40" width="340" height="130" rx="20" fill="#0d3a47" stroke="#1f6672"/>
<circle cx="110" cy="105" r="24" fill="none" stroke="#7fd6d0" stroke-width="3"/><text x="110" y="112" text-anchor="middle" fill="#7fd6d0" font-size="20" font-weight="700">1</text>
<text x="152" y="98" fill="#f3fbfa" font-size="24" font-weight="600">Capture</text>
<text x="152" y="128" fill="#8fbcbe" font-size="15">⇧⌘4, or Space for a window</text></g><path class="arrow a0" d="M412 105h44m-10-9 10 9-10 9" stroke="#f2994a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="step s1"><rect x="470" y="40" width="340" height="130" rx="20" fill="#0d3a47" stroke="#1f6672"/>
<circle cx="520" cy="105" r="24" fill="none" stroke="#7fd6d0" stroke-width="3"/><text x="520" y="112" text-anchor="middle" fill="#7fd6d0" font-size="20" font-weight="700">2</text>
<text x="562" y="98" fill="#f3fbfa" font-size="24" font-weight="600">Mark it up</text>
<text x="562" y="128" fill="#8fbcbe" font-size="15">Arrows, steps, redaction, blur</text></g><path class="arrow a1" d="M822 105h44m-10-9 10 9-10 9" stroke="#f2994a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="step s2"><rect x="880" y="40" width="340" height="130" rx="20" fill="#0d3a47" stroke="#1f6672"/>
<circle cx="930" cy="105" r="24" fill="none" stroke="#7fd6d0" stroke-width="3"/><text x="930" y="112" text-anchor="middle" fill="#7fd6d0" font-size="20" font-weight="700">3</text>
<text x="972" y="98" fill="#f3fbfa" font-size="24" font-weight="600">Share</text>
<text x="972" y="128" fill="#8fbcbe" font-size="15">Copied. Drag, save or upload</text></g></g></svg>