<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18211d"/><stop offset="1" stop-color="#0f1412"/></linearGradient>
    <style>
      /* A 6-second loop: each step lights up in turn and the arrow after it pulses. */
      .step { animation: step 6s ease-in-out infinite; }
      .s2 { animation-delay: 2s; } .s3 { animation-delay: 4s; }
      .go { opacity: 0.35; animation: go 6s ease-in-out infinite; }
      .g2 { animation-delay: 2s; }
      @keyframes step { 0%, 30%, 100% { fill-opacity: 0.04; stroke-opacity: 0.12; } 6%, 26% { fill-opacity: 0.16; stroke-opacity: 0.6; } }
      @keyframes go { 0%, 22%, 45%, 100% { opacity: 0.35; transform: none; } 30% { opacity: 1; transform: translateX(5px); } }
      @media (prefers-reduced-motion: reduce) { .step, .go { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="210" rx="24" fill="url(#bg)"/>
  <!-- arrows between the steps pulse as the highlight moves on -->
  <g fill="none" stroke="#d9e8ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path class="go g1" d="M432 105 h26 m-9 -9 l9 9 l-9 9"/>
    <path class="go g2" d="M822 105 h26 m-9 -9 l9 9 l-9 9"/>
  </g>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- 1 Capture -->
    <rect class="step" x="90" y="30" width="320" height="150" rx="20" fill="#d9e8ad" fill-opacity="0.04" stroke="#d9e8ad" stroke-opacity="0.12"/>
    <g transform="translate(250 72)" fill="none" stroke="#d9e8ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 -8 v-14 h14 M8 -22 h14 v14 M22 8 v14 h-14 M-8 22 h-14 v-14"/>
      <rect x="-9" y="-7" width="18" height="15" rx="3" fill="#d9e8ad" stroke="none"/>
    </g>
    <text x="250" y="132" font-size="22" font-weight="700" fill="#f5f5f0">Capture</text>
    <text x="250" y="156" font-size="14" fill="#9fae99">Area, window or screen · hold Space</text>

    <!-- 2 Annotate -->
    <rect class="step s2" x="480" y="30" width="320" height="150" rx="20" fill="#d9e8ad" fill-opacity="0.04" stroke="#d9e8ad" stroke-opacity="0.12"/>
    <g transform="translate(640 72)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-24" y="-18" width="30" height="24" rx="4" stroke="#ff453a" stroke-width="3"/>
      <path d="M22 18 L2 0" stroke="#ff453a" stroke-width="3"/>
      <path d="M-2 -4 L9 -1 L2 6 Z" fill="#ff453a" stroke="#ff453a" stroke-width="2"/>
      <circle cx="18" cy="-14" r="8" fill="#0a84ff" stroke="none"/>
    </g>
    <text x="640" y="132" font-size="22" font-weight="700" fill="#f5f5f0">Annotate</text>
    <text x="640" y="156" font-size="14" fill="#9fae99">Arrows, boxes, text, blur, redact</text>

    <!-- 3 Share -->
    <rect class="step s3" x="870" y="30" width="320" height="150" rx="20" fill="#d9e8ad" fill-opacity="0.04" stroke="#d9e8ad" stroke-opacity="0.12"/>
    <g transform="translate(1030 72)" fill="none" stroke="#d9e8ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-20" y="-6" width="40" height="28" rx="5"/>
      <path d="M0 8 V-24 M-9 -15 L0 -24 L9 -15"/>
    </g>
    <text x="1030" y="132" font-size="22" font-weight="700" fill="#f5f5f0">Share</text>
    <text x="1030" y="156" font-size="14" fill="#9fae99">Copy, save, drag or upload a link</text>
  </g>
</svg>
