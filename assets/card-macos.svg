<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2722"/><stop offset="1" stop-color="#121815"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d64b32" stop-opacity="0"/><stop offset="0.5" stop-color="#d64b32" stop-opacity="0.9"/><stop offset="1" stop-color="#d64b32" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="396" height="146" rx="20"/></clipPath>
    <style>
      .float { animation: float 5s ease-in-out 0.0s infinite; }
      .sweep { animation: sweep 5s ease-in-out 0.0s infinite; }
      .arrow { animation: nudge 5s ease-in-out 0.0s infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes sweep { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(460px); } }
      @keyframes nudge { 0%, 60%, 100% { transform: none; } 75% { transform: translateX(4px); } }
      @media (prefers-reduced-motion: reduce) { .float, .sweep, .arrow { animation: none; } }
    </style>
  </defs>
  <rect x="2" y="2" width="396" height="146" rx="20" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#card)"><rect class="sweep" x="0" y="0" width="140" height="150" fill="url(#sheen)" opacity="0.08"/></g>
  <rect x="2" y="2" width="396" height="146" rx="20" fill="none" stroke="#d64b32" stroke-opacity="0.25"/>
