<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2722"/><stop offset="1" stop-color="#121815"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9e8ad" stop-opacity="0"/><stop offset="0.5" stop-color="#d9e8ad" stop-opacity="0.9"/><stop offset="1" stop-color="#d9e8ad" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="396" height="146" rx="20"/></clipPath>
    <style>
      .float { animation: float 5s ease-in-out 1.2s infinite; }
      .sweep { animation: sweep 5s ease-in-out 1.2s infinite; }
      .arrow { animation: nudge 5s ease-in-out 1.2s infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes sweep { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(460px); } }
      @keyframes nudge { 0%, 60%, 100% { transform: none; } 75% { transform: translateX(4px); } }
      @media (prefers-reduced-motion: reduce) { .float, .sweep, .arrow { animation: none; } }
    </style>
  </defs>
  <rect x="2" y="2" width="396" height="146" rx="20" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#card)"><rect class="sweep" x="0" y="0" width="140" height="150" fill="url(#sheen)" opacity="0.08"/></g>
  <rect x="2" y="2" width="396" height="146" rx="20" fill="none" stroke="#d9e8ad" stroke-opacity="0.25"/>
  <g class="float"><g transform="translate(34 36) scale(2.7)"><ellipse cx="12" cy="13" rx="6" ry="8.5" fill="#f5f5f0"/><ellipse cx="12" cy="15" rx="3.8" ry="5.6" fill="#1b211d"/><circle cx="10.3" cy="8" r="1.2" fill="#1b211d"/><circle cx="13.7" cy="8" r="1.2" fill="#1b211d"/><path d="M10.3 10.2 12 11.6l1.7-1.4z" fill="#f5b400"/><ellipse cx="8.2" cy="21.2" rx="2.6" ry="1.2" fill="#f5b400"/><ellipse cx="15.8" cy="21.2" rx="2.6" ry="1.2" fill="#f5b400"/></g></g>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="118" y="62" font-size="28" font-weight="700" fill="#f5f5f0">Linux</text>
    <text x="118" y="86" font-size="14" fill="#9fae99">AppImage · .deb · .rpm</text>
    <text x="118" y="106" font-size="13" fill="#6f7d6b">Ubuntu 24.04+, Fedora 40+</text>
    <rect x="282" y="104" width="100" height="30" rx="15" fill="#d9e8ad"/>
    <text x="320" y="124" font-size="13" font-weight="700" fill="#1b211d" text-anchor="middle">Get it</text>
    <path class="arrow" d="M346 119 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#1b211d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
